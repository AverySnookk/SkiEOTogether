pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Downloads a JDK 25 automatically if the machine doesn't have one.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'BlocksideResort'

// core: plain-Java resort simulation (no Minecraft dependency, unit-tested).
include 'core'

// neoforge: the Minecraft mod. Needs maven.neoforged.net + Mojang servers.
// Build only the simulation with:  ./gradlew -PcoreOnly :core:test
if (!providers.gradleProperty('coreOnly').isPresent()) {
    include 'neoforge'
}
